[package]
name = "cloud_lib"
version = "1.0.4"
edition = "2021"

[lib]
name = "cloud_lib"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
